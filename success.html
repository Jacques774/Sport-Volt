<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Credit Claim | Sport Volt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-primary: #050b14;       /* Deep midnight stadium background */
      --bg-card: #0d1726;          /* Lighter navy container */
      --text-main: #ffffff;        /* Crisp white text */
      --text-muted: #94a3b8;       /* Muted grey for labels */
      --accent-blue: #00d2ff;      /* Electric cyan glow accent */
      --border-color: #1e293b;     /* Dark subtle borders */
      --yes-green: #22c55e;        /* Lucky green accent */
    }

    html, body {
      font-family: "Segoe UI", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .success-card {
      background-color: var(--bg-card);
      border-radius: 16px;
      padding: 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
    }

    .volt-icon {
      font-size: 3.2rem;
      color: var(--accent-blue);
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px rgba(0, 210, 255, 0.3); transform: scale(1); }
      100% { text-shadow: 0 0 25px rgba(0, 210, 255, 0.8); transform: scale(1.05); }
    }

    h1 {
      color: var(--text-main);
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .draw-box {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--yes-green);
      background: #050b14;
      padding: 18px;
      border-radius: 12px;
      border: 2px dashed var(--yes-green);
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
      letter-spacing: 1px;
    }

    .balance-box {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-blue);
      background: #050b14;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      background: var(--yes-green);
      color: #000;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
      transition: all 0.3s;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .action-btn:hover {
      background: #16a34a;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.7);
    }

    .home-btn {
      display: none;
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      background: var(--accent-blue);
      color: #000;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      transition: all 0.3s;
      box-sizing: border-box;
    }

    .home-btn:hover {
      background: #38bdf8;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.7);
    }
  </style>
</head>
<body>

  <div class="success-card">
    <div class="volt-icon">🎁</div>
    <h1 id="title-text">Lucky Credit Drop</h1>
    <p id="success-message">Tap below to spin and win your free Volts!</p>
    
    <div class="draw-box" id="draw-display">
      ❓ ? ? ❓
    </div>

    <div class="balance-box" id="balance-display">
      Current Balance: Loading...
    </div>

    <button id="spin-btn" class="action-btn">Spin For Volts ⚡</button>

    <a href="/MainMenu.html?token=sportvolt_secure_pass" id="home-btn" class="home-btn">Back to Main Menu</a>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    /* 🛡️ TEMPORARILY DISABLED BOUNCER FOR TESTING
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (token !== 'sportvolt_secure_pass') {
      console.log("Direct access attempt blocked. Redirecting to Wix...");
      window.location.replace("https://thesportvolt.wixsite.com/sport-volt");
      return;
    }
    */

    const rawWallet = localStorage.getItem("user_credit");
    let currentWallet = (rawWallet !== null && !isNaN(parseFloat(rawWallet))) ? parseFloat(rawWallet) : 20.00;
    
    const balanceDisplay = document.getElementById("balance-display");
    const drawDisplay = document.getElementById("draw-display");
    const spinBtn = document.getElementById("spin-btn");
    const homeBtn = document.getElementById("home-btn");
    const successMsg = document.getElementById("success-message");
    const titleText = document.getElementById("title-text");

    balanceDisplay.textContent = `Current Balance: ${currentWallet.toFixed(2)}⚡`;

    // 🛡️ 2. PREVENT REFRESH EXPLOIT
    const alreadyClaimed = sessionStorage.getItem("free_credit_claimed");
    const previousPrize = sessionStorage.getItem("last_won_prize");

    if (alreadyClaimed === "true" && previousPrize) {
      drawDisplay.textContent = `+${previousPrize}⚡ Won!`;
      successMsg.textContent = `You have already claimed your lucky draw credits for this session.`;
      titleText.textContent = `Already Claimed`;
      spinBtn.style.display = "none";
      homeBtn.style.display = "block";
      balanceDisplay.textContent = `Updated Balance: ${currentWallet.toFixed(2)}⚡`;
      return;
    }

    // 🎰 3. LUCKY DRAW & CREDIT ALLOCATION
    spinBtn.addEventListener("click", () => {
      spinBtn.disabled = true;
      spinBtn.style.opacity = "0.5";
      successMsg.textContent = "Spinning the prize wheel...";

      const possiblePrizes = [5, 10, 15];
      
      let counter = 0;
      const rollInterval = setInterval(() => {
        const tempPrize = possiblePrizes[Math.floor(Math.random() * possiblePrizes.length)];
        drawDisplay.textContent = `⚡ ${tempPrize} ⚡`;
        counter++;

        if (counter > 12) {
          clearInterval(rollInterval);
          
          const wonOutcome = possiblePrizes[Math.floor(Math.random() * possiblePrizes.length)];
          currentWallet += wonOutcome;
          
          localStorage.setItem("user_credit", currentWallet.toFixed(2));
          sessionStorage.setItem("free_credit_claimed", "true");
          sessionStorage.setItem("last_won_prize", wonOutcome.toString());

          drawDisplay.textContent = `🎉 +${wonOutcome} Volts! 🎉`;
          successMsg.textContent = `Success! Added ${wonOutcome}⚡ free credits to your balance.`;
          titleText.textContent = `You Won!`;
          balanceDisplay.textContent = `Updated Balance: ${currentWallet.toFixed(2)}⚡`;
          
          spinBtn.style.display = "none";
          homeBtn.style.display = "block";
        }
      }, 90);
    });
  });
</script>

</body>
</html>
