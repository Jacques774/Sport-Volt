<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Menu | Sport Volt</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --bg-primary: #050b14;       /* Deep midnight stadium background from Wix */
      --bg-card: #0d1726;          /* Slightly lighter navy for containers */
      --text-main: #ffffff;        /* Crisp white typography */
      --text-muted: #94a3b8;       /* Muted grey for labels */
      --accent-blue: #00d2ff;      /* Electric cyan glow accent */
      --border-color: #1e293b;     /* Dark subtle borders */
      --yes-green: #22c55e;        /* Green accent */
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .topup-btn {
      background: transparent;
      color: var(--accent-blue);
      border: 1px dashed var(--accent-blue);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }
    .topup-btn:hover {
      background: rgba(0, 210, 255, 0.1);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
    }

    .temp-manager-btn {
      background: rgba(34, 197, 94, 0.1);
      color: var(--yes-green);
      border: 1px dashed var(--yes-green);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 16px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }
    .temp-manager-btn:hover {
      background: rgba(34, 197, 94, 0.2);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
    }

    .credit-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 32px;
      margin-bottom: 30px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .credit-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .credit-amount {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-blue);
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2rem;
      letter-spacing: 1px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .menu-btn {
      margin: 10px;
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-main);
      background: transparent;
      border: 1px solid var(--accent-blue);
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      width: 200px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .menu-btn:hover {
      background-color: var(--accent-blue);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
    }

    .wix-home-btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .wix-home-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }
  </style>

  <!-- 🛡️ ABSOLUTE WIX CHECKPOINT GUARD (Update bouncer redirect to Member Hub) -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (token !== 'sportvolt_secure_pass') {
      alert("Access Denied. You must enter through the Wix Member Hub.");
      window.location.replace("https://thesportvolt.wixsite.com/sport-volt/blank");
    }
  </script>
</head>
<body>

  <a href="/create-question.html" class="temp-manager-btn">📁 Manage Custom Decks (Temp)</a>
  <a href="/success.html" id="topup-link" class="topup-btn">⚡ Top Up 10 Volts (£1.00)</a>

  <div class="credit-box">
    <div class="credit-label">Available Credit</div>
    <div class="credit-amount" id="user-credit">20.00⚡</div>
  </div>

  <h1>Main Menu</h1>
  <a href="/gamesetup.html" id="host-btn" class="menu-btn">Host Player</a>
  <a href="/player" class="menu-btn">Player</a>

  <!-- 🏠 Return to Member Hub Button -->
  <a href="https://thesportvolt.wixsite.com/sport-volt/blank" class="wix-home-btn">🏠 Return to Member Hub</a>

  <script>
    let storedCredit = Number(localStorage.getItem("user_credit"));
    if (isNaN(storedCredit) || storedCredit <= 0) {
      storedCredit = 20.00; 
    }

    let userCredit = storedCredit;
    localStorage.setItem("user_credit", userCredit.toFixed(2));
    
    const creditEl = document.getElementById("user-credit");
    if (creditEl) {
      creditEl.textContent = userCredit.toFixed(2) + "⚡";
    }

    const hostBtn = document.getElementById("host-btn");
    if (hostBtn) {
      hostBtn.href = `/gamesetup.html?token=sportvolt_secure_pass&authorized=true&credit=${userCredit.toFixed(2)}`;
    }
  </script>
</body>
</html>
