<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Volt - Single Player</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .youtube-container {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: none;
    }
    .youtube-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
    }
    .youtube-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .stake-countdown-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid #f59e0b;
      color: #f59e0b;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1rem;
      text-align: center;
      margin-top: 14px;
      display: block;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
    }
  </style>
</head>
<body>

<!-- SINGLE PLAYER SETUP SLIDE -->
<div id="playerSetupSlide" class="player-details-slide" style="display: flex;">
  <div class="details-content">
    <h2>Single Player Mode</h2>

    <label>Your Name</label>
    <input type="text" id="player-name-input" placeholder="Enter your name" value="Solo Player">

    <label>Clip / Deck Code</label>
    <input type="text" id="clip-code-input" placeholder="Enter clip code" value="RUGBY24">

    <button id="start-solo-btn" type="button">Start Solo Game</button>

    <button onclick="window.location.href='https://thesportvolt.wixsite.com/sport-volt'" class="btn-app-back">
      ← Back to Sport Volt
    </button>
  </div>
</div>

<!-- SINGLE PLAYER DASHBOARD -->
<div class="dashboard hidden" id="dashboard">
  <div class="top-header">
    <div class="header-left">
      <div class="header-line" id="player-name">Player: Solo</div>
      <div class="header-line" id="player-balance">Balance: 50.00⚡</div>
      <div id="player-question-tally" style="font-size: 0.95rem; font-weight: 600; color: #38bdf8; margin-top: 4px;">
        Question 1 of 5
      </div>
    </div>
    <div class="header-right">
      <div class="header-line" id="player-wins">Wins: 0</div>
      <div class="header-line" id="player-cashouts">Cash-outs: 0</div>
    </div>
  </div>

  <!-- Cards -->
  <div class="cards">
    <!-- 📺 YOUTUBE VIDEO CLIP CONTAINER -->
    <div id="youtubeContainer" class="youtube-container">
      <div class="youtube-wrapper">
        <div id="youtubePlayer"></div>
      </div>
    </div>

    <div class="card" id="active-card">
      <div class="card-header">
        <div class="question-text" id="q-text">Loading question...</div>
      </div>
      <div class="choices">
        <button class="btn btn-yes" id="btn-yes">YES</button>
        <button class="btn btn-no" id="btn-no">NO</button>
      </div>

      <div class="cashout-row">
        <span class="position" id="q-info">
          You chose: --<br>
          Stake: --<br>
          Timer: --
        </span>
        <div class="cashout-action">
          <button class="cashout-btn" id="cashout-btn" disabled>Cash Out: --</button>
          <div class="cashout-timer" id="timer">Cash out: --s</div>
        </div>
      </div>
    </div>

    <!-- ⏱️ STAKE WINDOW TIMER BADGE (Outside & Below Card) -->
    <div id="stakeCountdown" class="stake-countdown-badge" style="display: block !important;">Stake window: 20s</div>
  </div>

  <div class="bottom-buttons">
    <button class="nav-btn" onclick="openHistory()">History</button>
  </div>

  <!-- ============================
       HISTORY FULL SCREEN PANEL
       ============================ -->
  <div id="historyPanel" class="history-panel">
    <div class="history-content">
      <button class="close-btn" onclick="closeHistory()">Close</button>
      <div class="history-header">Round History</div>
      <div class="history-list">
        <div style="color: var(--text-muted); text-align: center; margin-top: 30px;">No rounds played yet.</div>
      </div>
    </div>
  </div>

  <!-- ============================
       STAKE POPUP WITH CUSTOM KEYPAD
       ============================ -->
  <div id="stakePopup" class="stake-popup" style="display: none;">
    <div class="stake-popup-content">
      <h3>Place Stake</h3>
      
      <div id="stakeDisplay" style="background: var(--bg-primary); border: 2px solid var(--accent-blue); border-radius: 10px; color: var(--accent-blue); font-size: 1.8rem; font-weight: 800; padding: 10px; text-align: center; margin-bottom: 16px;">
        0
      </div>

      <input type="hidden" id="stakeInput" value="">

      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;">
        <button type="button" class="keypad-btn" onclick="pressKey('1')">1</button>
        <button type="button" class="keypad-btn" onclick="pressKey('2')">2</button>
        <button type="button" class="keypad-btn" onclick="pressKey('3')">3</button>
        <button type="button" class="keypad-btn" onclick="pressKey('4')">4</button>
        <button type="button" class="keypad-btn" onclick="pressKey('5')">5</button>
        <button type="button" class="keypad-btn" onclick="pressKey('6')">6</button>
        <button type="button" class="keypad-btn" onclick="pressKey('7')">7</button>
        <button type="button" class="keypad-btn" onclick="pressKey('8')">8</button>
        <button type="button" class="keypad-btn" onclick="pressKey('9')">9</button>
        <button type="button" class="keypad-btn" onclick="pressKey('C')" style="color: var(--no-red); font-weight: 800;">C</button>
        <button type="button" class="keypad-btn" onclick="pressKey('0')">0</button>
        <button type="button" class="keypad-btn" onclick="pressKey('ALL_IN')" style="color: #f59e0b; font-size: 0.75rem; font-weight: 800;">ALL IN</button>
      </div>

      <div class="stake-popup-actions">
        <button id="stake-save-btn">Place Stake</button>
        <button id="stake-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- GAME OVER MODAL -->
  <div id="gameOverModal" class="stake-popup" style="display: none;">
    <div class="stake-popup-content" style="text-align: center;">
      <h2 id="gameOverTitle" style="color: var(--accent-blue); margin-bottom: 10px;">Game Complete!</h2>
      <p id="gameOverMessage" style="font-size: 1.2rem; margin: 15px 0; font-weight: 600;">Well done! 🎉</p>
      <p id="gameOverFinalBalance" style="font-size: 1.1rem; color: var(--yes-green); margin-bottom: 20px;">Final Balance: 50.00⚡</p>
      <button onclick="window.location.reload();" style="background-color: var(--accent-blue); color: #000; padding: 10px 18px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; width: 100%; text-transform: uppercase;">Play Again</button>
    </div>
  </div>

</div>

<!-- EMBEDDED MODULE SCRIPT -->
<script type="module">
  import { SinglePlayerQuestions } from "./SinglePlayerQuestions.js";

  let lastQuestionId = null;

  const SoloQuestionPicker = {
    getRand() {
      let deck = SinglePlayerQuestions;
      if (!deck || deck.length === 0) {
        return { id: "fallback", text: "Will a try be scored in the next passage of play?", youtubeId: "389R5Kj-k98", timer: 90 };
      }

      let available = deck;
      if (lastQuestionId && deck.length > 1) {
        available = deck.filter(q => q.id !== lastQuestionId);
      }

      const randomIndex = Math.floor(Math.random() * available.length);
      const selected = available[randomIndex];
      lastQuestionId = selected.id;
      return selected;
    }
  };

  /*******************************
   * HISTORY MODULE
   *******************************/
  window.History = {
    items: [],

    push(entry) {
      entry.timestamp = new Date();
      entry.oldBalance = Number(entry.oldBalance || 0);
      entry.newBalance = Number(entry.newBalance || entry.oldBalance);
      this.items.push(entry);
      this.render();
    },

    formatProfit(entry) {
      const oldBal = typeof entry.oldBalance === "number" ? entry.oldBalance : 0;
      const newBal = typeof entry.newBalance === "number" ? entry.newBalance : 0;
      const profit = newBal - oldBal;

      if (profit > 0) return `<span class="profit-pos">(+${profit.toFixed(2)}⚡)</span>`;
      if (profit < 0) return `<span class="profit-neg">(-${Math.abs(profit).toFixed(2)}⚡)</span>`;
      return `<span class="profit-zero">(0⚡)</span>`;
    },

    formatTime(date) {
      const validDate = date instanceof Date ? date : new Date();
      const d = validDate.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
      const t = validDate.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      return `${d} • ${t}`;
    },

    outcomeClass(entry) {
      if (entry.cashedOut) return "outcome-cash";
      if (entry.userChoice === entry.outcome) return "outcome-yes";
      return "outcome-no";
    },

    outcomeText(entry) {
      if (entry.cashedOut) return "CASHED OUT";
      if (entry.outcome === "YES") return "YES ✔";
      if (entry.outcome === "NO") return "NO ✘";
      return entry.outcome || "--";
    },

    render() {
      const container = document.querySelector(".history-list");
      if (!container) return;

      if (this.items.length === 0) {
        container.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 30px;">No rounds played yet.</div>`;
        return;
      }

      container.innerHTML = this.items
        .slice()
        .reverse()
        .map(entry => {
          const oldBal = typeof entry.oldBalance === "number" ? entry.oldBalance : 0;
          const newBal = typeof entry.newBalance === "number" ? entry.newBalance : oldBal;

          return `
            <div class="history-card ${this.outcomeClass(entry)}">
              <div class="history-question">${entry.text || "Unknown question"}</div>
              <div class="history-outcome-text">${this.outcomeText(entry)}</div>
              <div class="history-balance">
                ${oldBal.toFixed(2)}⚡ → ${newBal.toFixed(2)}⚡
                ${this.formatProfit(entry)}
              </div>
              <div class="history-time">${this.formatTime(entry.timestamp)}</div>
            </div>
          `;
        })
        .join("");
    }
  };

  window.openHistory = function () {
    const panel = document.getElementById("historyPanel");
    if (panel) {
      panel.classList.add("active");
      if (window.History && typeof window.History.render === "function") {
        window.History.render();
      }
    }
  };

  window.closeHistory = function () {
    const panel = document.getElementById("historyPanel");
    if (panel) {
      panel.classList.remove("active");
    }
  };

  let playerName = "Solo Player";
  let balance = 50.00;
  let currentQuestionIndex = 0;
  let totalWins = 0;
  let totalCashouts = 0;

  let questionCountdown = null;
  let cashoutCountdown = null;
  let stakeTimerInterval = null;

  const setupSlide = document.getElementById("playerSetupSlide");
  const dashboard = document.getElementById("dashboard");
  const playerNameInput = document.getElementById("player-name-input");
  const clipCodeInput = document.getElementById("clip-code-input");
  const startSoloBtn = document.getElementById("start-solo-btn");

  const playerNameEl = document.getElementById("player-name");
  const playerBalanceEl = document.getElementById("player-balance");
  const questionTallyEl = document.getElementById("player-question-tally");
  const playerWinsEl = document.getElementById("player-wins");
  const playerCashoutsEl = document.getElementById("player-cashouts");
  
  const questionTextEl = document.getElementById("q-text");
  const qInfoEl = document.getElementById("q-info");
  const timerEl = document.getElementById("timer");

  const btnYes = document.getElementById("btn-yes");
  const btnNo = document.getElementById("btn-no");
  const cashoutBtn = document.getElementById("cashout-btn");

  const youtubeContainer = document.getElementById("youtubeContainer");
  const youtubePlayer = document.getElementById("youtubePlayer");

  const stakePopup = document.getElementById("stakePopup");
  const stakeDisplay = document.getElementById("stakeDisplay");
  const stakeInput = document.getElementById("stakeInput");
  const stakeSaveBtn = document.getElementById("stake-save-btn");
  const stakeCancelBtn = document.getElementById("stake-cancel-btn");

  const gameOverModal = document.getElementById("gameOverModal");
  const gameOverMessage = document.getElementById("gameOverMessage");
  const gameOverFinalBalance = document.getElementById("gameOverFinalBalance");

  let currentQuestionData = null;
  let currentStake = 0;
  let selectedChoice = null;
  let roundStartBalance = 50.00;

  startSoloBtn.onclick = function() {
    const nameVal = playerNameInput.value.trim();
    if (nameVal) playerName = nameVal;

    setupSlide.style.display = "none";
    setupSlide.classList.add("hidden");
    dashboard.classList.remove("hidden");

    playerNameEl.textContent = `Player: ${playerName}`;
    updateBalanceDisplay();
    loadQuestion();
  };

  function updateBalanceDisplay() {
    playerBalanceEl.textContent = `Balance: ${balance.toFixed(2)}⚡`;
  }

  function loadQuestion() {
    if (currentQuestionIndex >= SinglePlayerQuestions.length) {
      endGame();
      return;
    }

    currentQuestionData = SoloQuestionPicker.getRand();
    currentQuestionIndex++;

    roundStartBalance = balance;

    questionTallyEl.textContent = `Question ${currentQuestionIndex} of ${SinglePlayerQuestions.length}`;
    questionTextEl.textContent = currentQuestionData.text;
    qInfoEl.innerHTML = `You chose: --<br>Stake: --<br>Timer: ${currentQuestionData.timer || 90}s`;

    btnYes.disabled = false;
    btnNo.disabled = false;
    btnYes.classList.remove("selected");
    btnNo.classList.remove("selected");
    selectedChoice = null;
    currentStake = 0;

    cashoutBtn.disabled = true;
    cashoutBtn.textContent = "Cash Out: --";
    timerEl.textContent = "Cash out: --s";

    if (currentQuestionData.youtubeId) {
      youtubeContainer.style.display = "block";
      youtubePlayer.innerHTML = `<iframe src="https://www.youtube.com/embed/${currentQuestionData.youtubeId}?autoplay=1&mute=1&enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }

    startStakeWindow(20, () => {
      btnYes.disabled = true;
      btnNo.disabled = true;
      if (currentStake > 0) {
        startCashoutTimer(Math.floor((currentQuestionData.timer || 90) / 2));
      }
    });

    startQuestionTimer(currentQuestionData.timer || 90);
  }

  function startStakeWindow(duration, onComplete) {
    let timeLeft = duration;
    const badgeEl = document.getElementById("stakeCountdown");
    
    if (badgeEl) {
      badgeEl.style.setProperty("display", "block", "important");
      badgeEl.textContent = `Stake window: ${timeLeft}s`;
    }

    clearInterval(stakeTimerInterval);
    stakeTimerInterval = setInterval(() => {
      timeLeft--;
      if (badgeEl) {
        badgeEl.textContent = `Stake window: ${timeLeft}s`;
      }

      if (timeLeft <= 0) {
        clearInterval(stakeTimerInterval);
        if (badgeEl) {
          badgeEl.style.setProperty("display", "none", "important");
        }
        if (typeof onComplete === "function") onComplete();
      }
    }, 1000);
  }

  function startQuestionTimer(duration) {
    let timeLeft = duration;
    
    clearInterval(questionCountdown);
    questionCountdown = setInterval(() => {
      timeLeft--;
      qInfoEl.innerHTML = `You chose: ${selectedChoice || "--"}<br>Stake: ${currentStake > 0 ? currentStake + "⚡" : "--"}<br>Timer: ${timeLeft}s`;

      if (timeLeft <= 0) {
        clearInterval(questionCountdown);
        clearInterval(cashoutCountdown);
        clearInterval(stakeTimerInterval);
        const badgeEl = document.getElementById("stakeCountdown");
        if (badgeEl) badgeEl.style.setProperty("display", "none", "important");
        resolveSoloQuestion();
      }
    }, 1000);
  }

  function startCashoutTimer(duration) {
    let timeLeft = duration;
    timerEl.textContent = `Cash out: ${timeLeft}s`;

    clearInterval(cashoutCountdown);
    cashoutCountdown = setInterval(() => {
      timeLeft--;
      timerEl.textContent = `Cash out: ${timeLeft}s`;

      if (timeLeft <= 0) {
        clearInterval(cashoutCountdown);
        cashoutBtn.disabled = true;
        timerEl.textContent = "Cash out: Expired";
      }
    }, 1000);
  }

  btnYes.onclick = () => openStakePopup("YES");
  btnNo.onclick = () => openStakePopup("NO");

  function openStakePopup(choice) {
    selectedChoice = choice;
    if (choice === "YES") {
      btnYes.classList.add("selected");
      btnNo.classList.remove("selected");
    } else {
      btnNo.classList.add("selected");
      btnYes.classList.remove("selected");
    }

    stakeDisplay.textContent = "0";
    stakeInput.value = "0";
    stakePopup.style.display = "flex";
  }

  window.pressKey = function(key) {
    let valStr = stakeInput.value || "0";
    if (key === 'C') {
      valStr = "0";
    } else if (key === 'ALL_IN') {
      valStr = Math.floor(balance).toString();
    } else {
      if (valStr === "0") valStr = key;
      else valStr += key;
    }

    const numVal = Number(valStr);
    if (numVal > balance) valStr = Math.floor(balance).toString();

    stakeInput.value = valStr;
    stakeDisplay.textContent = valStr;
  };

  stakeCancelBtn.onclick = () => {
    stakePopup.style.display = "none";
  };

  stakeSaveBtn.onclick = () => {
    const stakeValue = Number(stakeInput.value);
    if (stakeValue <= 0 || stakeValue > balance) {
      alert("Please enter a valid stake within your available balance.");
      return;
    }

    currentStake = stakeValue;
    balance -= currentStake;
    updateBalanceDisplay();

    qInfoEl.innerHTML = `You chose: <span style="color:${selectedChoice==='YES'?'var(--yes-green)':'var(--no-red)'}; font-weight:700;">${selectedChoice}</span><br>Stake: ${currentStake}⚡<br>Timer: Active`;
    stakePopup.style.display = "none";

    cashoutBtn.disabled = false;
    cashoutBtn.textContent = `Cash Out: ${(currentStake * 0.5).toFixed(2)}⚡`;
    startCashoutTimer(Math.floor((currentQuestionData.timer || 90) / 2));
  };

  cashoutBtn.onclick = () => {
    if (currentStake <= 0) return;

    clearInterval(cashoutCountdown);
    const refund = currentStake * 0.5;
    balance += refund;
    updateBalanceDisplay();

    totalCashouts++;
    playerCashoutsEl.textContent = `Cash-outs: ${totalCashouts}`;

    cashoutBtn.disabled = true;
    timerEl.textContent = "Cashed Out";
    qInfoEl.innerHTML += `<br><span style="color: #f59e0b;">Cashed out +${refund.toFixed(2)}⚡</span>`;

    window.History.push({
      text: currentQuestionData.text,
      userChoice: selectedChoice,
      outcome: "--",
      cashedOut: true,
      oldBalance: roundStartBalance,
      newBalance: balance
    });

    setTimeout(() => {
      loadQuestion();
    }, 1500);
  };

  function resolveSoloQuestion() {
    clearInterval(questionCountdown);
    clearInterval(cashoutCountdown);
    clearInterval(stakeTimerInterval);
    const badgeEl = document.getElementById("stakeCountdown");
    if (badgeEl) badgeEl.style.setProperty("display", "none", "important");

    const outcome = Math.random() > 0.5 ? "YES" : "NO";
    const isWin = (currentStake > 0 && selectedChoice === outcome);

    if (currentStake > 0) {
      if (isWin) {
        const payout = currentStake * 2;
        balance += payout;
        totalWins++;
        playerWinsEl.textContent = `Wins: ${totalWins}`;
        alert(`Result: WIN! +${payout}⚡`);
      } else {
        alert(`Result: LOSS. Better luck next question!`);
      }
      updateBalanceDisplay();
    } else {
      alert(`Time up! No stake placed.`);
    }

    if (currentStake > 0) {
      window.History.push({
        text: currentQuestionData.text,
        userChoice: selectedChoice,
        outcome: outcome,
        cashedOut: false,
        oldBalance: roundStartBalance,
        newBalance: balance
      });
    }

    setTimeout(() => {
      loadQuestion();
    }, 1000);
  }

  function endGame() {
    clearInterval(questionCountdown);
    clearInterval(cashoutCountdown);
    clearInterval(stakeTimerInterval);
    youtubeContainer.style.display = "none";
    youtubePlayer.innerHTML = "";

    gameOverMessage.innerHTML = balance >= 50 ? "Fantastic run! You finished in profit! 🎉" : "Game complete! Great effort on the blitz. 🏉";
    gameOverFinalBalance.textContent = `Final Balance: ${balance.toFixed(2)}⚡`;
    gameOverModal.style.display = "flex";
  }
</script>

</body>
</html>
